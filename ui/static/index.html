<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>管理后台</title>
  <link rel="stylesheet" href="/static/styles.css?v=combo-rfq1" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo" id="domainTitle">管理后台</span>
        <span class="role-chip" id="roleChip">角色</span>
        <span class="ver" id="domainBadge">—</span>
      </div>
      <div class="top-actions">
        <a class="linkish" id="mallLink" href="http://127.0.0.1:8080" target="_blank" rel="noopener">打开座椅商城</a>
        <span id="healthPills" class="pills"></span>
      </div>
    </header>

    <div id="agentSwitch" class="agent-switch"></div>

    <section id="viewConsole" class="view">
      <div class="erp">
        <aside class="sidebar">
          <div class="side-label chat-nav">工作</div>
          <button type="button" class="nav active chat-nav" data-page="chat">智能对话</button>
          <button type="button" class="nav chat-nav" data-page="notify">通知中心 <span id="badgeNtf" class="badge">0</span></button>
          <button type="button" class="nav chat-nav" data-page="workbench">工作台</button>
          <div class="side-label buyer-only">业务单据</div>
          <button type="button" class="nav buyer-only" data-page="sales">销售订单</button>
          <button type="button" class="nav buyer-only" data-page="inventory">原料库存</button>
          <div class="side-label chat-nav">追溯</div>
          <button type="button" class="nav chat-nav" data-page="history">对话历史</button>

          <div class="side-label supplier-only hidden">供应管理</div>
          <button type="button" class="nav supplier-only hidden" data-page="catalog">库存与价目</button>
          <button type="button" class="nav supplier-only hidden" data-page="inbox">询价箱</button>

          <div class="side-label">办公协同</div>
          <button type="button" class="nav" data-page="mailbox">邮箱 <span id="badgeMail" class="badge">0</span></button>
          <button type="button" class="nav" data-page="tickets">工单待办 <span id="badgeTicket" class="badge">0</span></button>
          <button type="button" class="nav" data-page="audit">回溯审计</button>
        </aside>

        <main class="center">
          <div class="center-head">
            <h2 id="pageTitle">智能对话</h2>
            <p id="pageSub" class="muted hidden"></p>
          </div>

          <div id="pageChat" class="page">
            <div id="chatAgentTag" class="chat-agent-tag hidden"></div>
            <div class="thread-bar">
              <div class="thread-picker" id="threadPicker">
                <button type="button" class="thread-current" id="threadCurrent" aria-expanded="false">
                  <span id="threadCurrentLabel">选择对话</span>
                  <span class="thread-caret">▾</span>
                </button>
                <div class="thread-menu hidden" id="threadMenu" role="listbox"></div>
              </div>
              <button type="button" id="btnNewThread" class="sec">新建对话</button>
            </div>
            <div id="groupRoomReopen" class="group-room-reopen hidden">
              <button type="button" class="sec" id="groupRoomReopenBtn">展开组群聊天室</button>
            </div>
            <div id="chatFlowBar" class="chat-flow-bar muted hidden">
              <span id="flowCaseLabel"></span>
              <div id="flowSteps" class="flow-steps"></div>
            </div>
            <div id="auctionWatch" class="auction-watch hidden" aria-live="polite"></div>
            <div id="chatMsgs" class="chat-msgs"></div>
            <div id="shortlistDock" class="shortlist-dock hidden"></div>
            <div id="choiceDock" class="choice-dock hidden"></div>
            <div class="chat-input">
              <textarea id="chatText" rows="1" placeholder="输入消息，或先点选上方按钮…"></textarea>
              <button type="button" id="btnSend">发送</button>
            </div>
          </div>

          <div id="pagePeer" class="page hidden">
            <div class="peer-panel">
              <h3 id="peerTitle">智能体工作区</h3>
              <p id="peerBody" class="muted"></p>
            </div>
          </div>

          <div id="pageNotify" class="page hidden"><div id="notifyList" class="list"></div></div>
          <div id="pageWorkbench" class="page hidden"><div id="workbench" class="cards"></div></div>
          <div id="pageSales" class="page hidden"><div id="salesTable" class="table-wrap"></div></div>
          <div id="pageInventory" class="page hidden"><div id="invTable" class="table-wrap"></div></div>
          <div id="pageHistory" class="page hidden"><div id="histList" class="list"></div></div>
          <div id="pageMailbox" class="page hidden">
            <div class="office-toolbar">
              <span id="mailAddr" class="muted"></span>
              <select id="mailFolder">
                <option value="">全部</option>
                <option value="inbox">收件箱</option>
                <option value="sent">已发送</option>
              </select>
              <button type="button" id="btnMailRefresh" class="sec">刷新</button>
            </div>
            <div id="mailList" class="list"></div>
          </div>
          <div id="pageTickets" class="page hidden">
            <div class="office-toolbar">
              <select id="ticketFilter">
                <option value="">全部</option>
                <option value="open">待办</option>
                <option value="suspended">挂起</option>
                <option value="closed">已回档</option>
              </select>
              <button type="button" id="btnTicketNew" class="sec">新建工单</button>
              <button type="button" id="btnTicketRefresh" class="sec">刷新</button>
            </div>
            <div id="ticketList" class="list"></div>
          </div>
          <div id="pageAudit" class="page hidden">
            <div class="office-toolbar">
              <button type="button" id="btnAuditRefresh" class="sec">刷新</button>
              <span class="muted" id="auditHint">点选订单可查看代码级全链路与梧桐交互</span>
            </div>
            <div id="auditOrderList" class="list audit-orders"></div>
            <div id="auditDetail" class="audit-detail hidden"></div>
            <div id="auditList" class="list"></div>
          </div>
          <div id="pageCatalog" class="page hidden"><div id="catalogTable" class="table-wrap"></div></div>
          <div id="pageInbox" class="page hidden"><div id="inboxTable" class="table-wrap"></div></div>
        </main>

        <aside class="right">
          <div class="rhead">多智能体协作</div>
          <div id="collabAgents" class="collab-agents"></div>
          <div id="rightAudit" class="rbody">
            <div id="collabHead" class="collab-sticky"></div>
            <div id="collabTimeline" class="collab-timeline"></div>
          </div>
        </aside>
      </div>
    </section>
  </div>
  <div id="toastStack" class="toast-stack" aria-live="polite"></div>
  <div id="detailModal" class="detail-modal hidden" role="dialog" aria-modal="true">
    <div class="detail-backdrop" id="detailBackdrop"></div>
    <div class="detail-panel">
      <div class="detail-head">
        <h3 id="detailTitle">详情</h3>
        <button type="button" class="sec" id="detailClose">关闭</button>
      </div>
      <div id="detailBody" class="detail-body"></div>
    </div>
  </div>
  <div id="groupRoomModal" class="group-room-modal hidden" role="dialog" aria-modal="true" aria-label="组群竞价聊天室">
    <div class="group-room-backdrop" id="groupRoomBackdrop"></div>
    <div class="group-room-panel">
      <div class="group-room-head">
        <div>
          <h3 id="groupRoomTitle">组群竞价聊天室</h3>
          <p id="groupRoomMeta" class="muted"></p>
        </div>
        <button type="button" class="sec" id="groupRoomClose">收起</button>
      </div>
      <div id="groupRoomTicker" class="group-room-ticker" aria-live="polite"></div>
      <div id="groupRoomMembers" class="group-room-members"></div>
      <div id="groupRoomMsgs" class="group-room-msgs"></div>
      <div id="groupRoomActions" class="group-room-actions"></div>
    </div>
  </div>
  <script src="/static/app.js?v=group-room-collapse3"></script>
</body>
</html>
